[tool.poetry]
name = "car_insurance_telematics"
version = "0.1.0"
description = "A machine learning system for assessing driver risk and predicting insurance claims based on telematics data"
authors = ["Ali Zarreh <alireza.zarreh@gmail.com>"]
readme = "README.md"
packages = [{include = "car_insurance_telematics"}]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.0.0"
numpy = "^1.24.0"
scikit-learn = "^1.7.0"
xgboost = "^3.0.2"
optuna = "^4.4.0"
optuna-integration = {extras = ["xgboost"], version = "^4.4.0"}
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
joblib = "^1.3.0"

[tool.poetry.group.dev.dependencies]
autoflake = "^2.3.1"
black = "^25.1.0"
isort = "^6.0.1"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
